# NHC full cohort — B3 ablation (strategies 1–6, 8). Strategy 7 (LLM) omitted on NHC.
# Launched via: my_Thyroid_Infer/nhc_routing_ablation/run_seven_strategies.py
#
# model_path / model_dir: relative to my_Thyroid_Infer (materialized to absolute paths before Cascade runs).
shared:
  agent_llm:
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3.8-omni-flash
    temperature: 0.3
    max_tokens: 768
    enable_thinking: false
segmentation:
  models:
  - type: dinov3_unet
    name: all_datasets
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_all_datasets_epoch_40.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: TN3K
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_TN3K_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: ThyroidXL
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_ThyroidXL_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: PKTN_comprehensive
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_PKTN_comprehensive_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: TN5K
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_TN5K_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  agent:
    enable_agent: false
    routing_mode: static_rule
    brief_routing_prompt: true
    include_disagreement_metrics_in_prompt: true
    pre_filter:
      cosine_threshold: 0.8
      prob_outlier_threshold: 0.4
      min_keep: 1
    ensemble:
      enabled: true
      top_k: 1
      method: weighted_average
      threshold: 0.5
classification:
  models:
  - type: dinov3_unet_multitask
    name: all_datasets
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_all_datasets_epoch_40.pth
    use_tirads: false
  - type: dinov3_unet_multitask
    name: TN3K
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_TN3K_epoch_50.pth
    use_tirads: false
  - type: dinov3_unet_multitask
    name: TN5K
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_TN5K_epoch_50.pth
    use_tirads: false
  - type: dinov3_unet_multitask
    name: ThyroidXL
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_ThyroidXL_epoch_50.pth
    use_tirads: false
  agent:
    enable_agent: false
    routing_mode: soft_voting
    brief_routing_prompt: true
    top_k: 5
    consensus_min_confidence: 0.6
radiomics_judge:
  enabled: true
  model_dir: ./infer_autogluon/checkpoints/binary/autogluon_model_20260204_140346
  top_k_features: 5
  radiomics_params: ./infer_autogluon/radiomics_2d.yaml
pipeline:
  preload_workers: 4
  run_segmentation: true
  run_classification: true
  ablation:
    routing_modes:
    - best_single
    - soft_voting
    - majority
    - static_rule
    - max_confidence
    - oracle
    shared_intermediate: output/NHC-MISD-TUS/pipeline_run/intermediate
    output_root: results/nhc_routing_ablation/nhc_misd_tus
    force_phase3: true
    summarize: true
    task: both
    learned_router:
      # 默认：TN5K *validation* 拟合（B3 主表）。试跑 test 拟合见 fit_learned_on_test.py → learned_fit_tn5k_test/
      seg_artifact: artifacts/b3/tn5k/learned_router_seg.joblib
      cls_artifact: artifacts/b3/tn5k/learned_router_cls.joblib
      allow_missing_artifact: false
      write_random_artifact: false
    best_single_seg: all_datasets
    best_single_cls: all_datasets
    val_list: null
  data:
    image_input: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/NHC-MISD-TUS/images
    gt_mask_dir: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/NHC-MISD-TUS/masks
    label_file: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/NHC-MISD-TUS/labels.json
    label_key: malignancy
    device_info:
    - GE Logiq E9
    - GE S7
    start_index: 0
    max_images: null
  log_routing: false
  routing_log_include_prompts: false
  output:
    output_dir: output/NHC-MISD-TUS/pipeline_run
