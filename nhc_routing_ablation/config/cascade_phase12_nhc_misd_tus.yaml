# Phase 1–2 only for full NHC (expert forward cache). Weights relative to my_Thyroid_Infer (see paths.materialize_cascade_config_for_infer).
# Used by run_seven_strategies.py before B3 bundle.
shared:
  agent_llm:
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3.8-omni-flash
    temperature: 0.3
    max_tokens: 768
    enable_thinking: false
segmentation:
  models:
  - type: dinov3_unet
    name: all_datasets
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_all_datasets_epoch_40.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: TN3K
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_TN3K_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: ThyroidXL
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_ThyroidXL_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: PKTN_comprehensive
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_PKTN_comprehensive_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  - type: dinov3_unet
    name: TN5K
    model_path: ./infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_TN5K_epoch_50.pth
    input_size: [224, 224]
    threshold: 0.5
  agent:
    enable_agent: false
    routing_mode: static_rule
    ensemble:
      enabled: true
      top_k: 1
      method: weighted_average
      threshold: 0.5
classification:
  models:
  - type: dinov3_unet_multitask
    name: all_datasets
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_all_datasets_epoch_40.pth
    use_tirads: false
  - type: dinov3_unet_multitask
    name: TN3K
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_TN3K_epoch_50.pth
    use_tirads: false
  - type: dinov3_unet_multitask
    name: TN5K
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_TN5K_epoch_50.pth
    use_tirads: false
  - type: dinov3_unet_multitask
    name: ThyroidXL
    model_path: ./infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_train_multitask_ThyroidXL_epoch_50.pth
    use_tirads: false
  agent:
    enable_agent: false
    routing_mode: soft_voting
    top_k: 5
    consensus_min_confidence: 0.6
radiomics_judge:
  enabled: false
pipeline:
  preload_workers: 4
  run_segmentation: true
  run_classification: true
  stop_after_phase2: true
  data:
    image_input: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/NHC-MISD-TUS/images
    gt_mask_dir: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/NHC-MISD-TUS/masks
    label_file: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/NHC-MISD-TUS/labels.json
    label_key: malignancy
    start_index: 0
    max_images: null
  log_routing: false
  output:
    output_dir: output/NHC-MISD-TUS/pipeline_run
